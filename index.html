<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Día de las Madres</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffe4e1, #fff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    width: 90%;
    max-width: 380px;
    animation: aparecer 1.2s ease;
  }

  h1 {
    color: #d63384;
    font-size: 22px;
  }

  #mensaje {
    font-size: 16px;
    color: #444;
    min-height: 60px;
    margin-top: 10px;
  }

  button {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border: none;
    background: #ff69b4;
    color: white;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:active {
    transform: scale(0.97);
  }

  .firma {
    margin-top: 18px;
    font-size: 13px;
    color: #777;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(15px);}
    to { opacity: 1; transform: translateY(0);}
  }

  @keyframes flotar {
    from {
      transform: translateY(0);
      opacity: 1;
    }
    to {
      transform: translateY(-100vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="card">
  <h1>🌸 Feliz Día de las Madres 🌸</h1>

  <p id="mensaje">
    Quiero desearles un día muy especial, lleno de momentos bonitos y sonrisas... 🌷
  </p>

  <button onclick="cambiarMensaje()">💌 Ver otro mensaje</button>
  <button onclick="mostrarFinal()">💖 Mensaje especial</button>

  <p class="firma">
    Con mucho cariño,<br>
    Ricardo 😊
  </p>
</div>

<script>
const mensajes = [
  "Gracias por todo el amor y esfuerzo que han dado siempre por su familia ❤️",
  "Se nota el gran trabajo y dedicación que han puesto para formar una familia tan bonita 😊",
  "Los valores y el cariño que transmiten hablan del gran corazón que tienen 💖",
  "Gracias por cada enseñanza y por todo lo que hacen día con día 🌷",
  "El amor que le dan a su familia es algo que realmente se admira ✨"
];

let mensajesDisponibles = [...mensajes];

function cambiarMensaje() {
  // Si ya se usaron todos, reiniciar lista
  if (mensajesDisponibles.length === 0) {
    mensajesDisponibles = [...mensajes];
  }

  const random = Math.floor(Math.random() * mensajesDisponibles.length);
  const mensaje = mensajesDisponibles[random];

  document.getElementById("mensaje").innerText = mensaje;

  // Eliminar el mensaje usado
  mensajesDisponibles.splice(random, 1);
}
  function mostrarFinal() {
    document.getElementById("mensaje").innerText =
      "De corazón, quiero reconocer el cariño que brindan. He tenido la oportunidad de conocer un poco de lo que han formado, y es una persona increíble, con valores y un corazón especial. Sin duda, todo eso refleja el gran amor y dedicación que le han dado siempre ❤️";
  }

  function crearCorazon() {
    const corazon = document.createElement("div");
    corazon.innerText = "💖";
    corazon.style.position = "fixed";
    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.bottom = "0";
    corazon.style.fontSize = "18px";
    corazon.style.animation = "flotar 4s linear";
    document.body.appendChild(corazon);

    setTimeout(() => {
      corazon.remove();
    }, 4000);
  }

  setInterval(crearCorazon, 1200);
</script>

</body>
</html>
